; Light v0.1.7 / x86 DX9 only
; All settings are read at engine initialization.
[Settings]
UnlockLights=1
MaxLights=8
TimerSizeFix=1
; D3D9 render-state interception may conflict with other render hooks.
HookD3DState=1
; Fast path: trust live Light*/WorldMesh* pointers received from Engine.dll.
; Set to 0 when debugging incompatible engine versions (slower VirtualQuery checks).
TrustEnginePointers=1
; Fast single-pass Uber: no state backup needed for additive batching.
; Switch to 0 to compare rendering correctness if you see state leakage.
FastSingleUberPass=1
; Log hook calls and pipeline counters every 5 seconds; use only for troubleshooting.
LogLights=0
; Debug only: keep original lighting passes, at the risk of double-lighting.
PreserveNativePasses=0
; Safety: preserve stock lights when no light was collected for a mesh.
SafeNativeFallback=1

; PERF / A-B diagnostic mode: 0 preserves original light passes and skips
; all extra light drawing, while the hooks still collect counters.
RenderExtraLights=1
; Hard budget of processed lights and draw passes per mesh.
; Raise slowly (16/4 -> 24/6 -> 48/12) after measuring frame time.
MaxRenderLightsPerMesh=4
MaxExtraPassesPerMesh=1

; v0.1.5 is intentionally conservative. Increase passes only after comparing FPS.
