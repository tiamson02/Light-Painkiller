; Light v0.2.7 - full source selection; original Painkiller and mods
; Restart the game after changing Light.ini.
; ExtraPassesPerMesh=0 now installs NO lighting hooks.
; Light.log is overwritten once per game session.
[Settings]
UnlockLights=1
MaxLights=128
; 124 means all 128 ordinary lights on one mesh can be drawn (4 native + 124 extra).
; For higher FPS on dense maps try 16 or 32, but sources beyond the budget
; WILL be omitted from that mesh. Each Uber pass may pack 3 (or 4) lights.
ExtraPassesPerMesh=124
TimerSizeFix=1
LogLights=0
