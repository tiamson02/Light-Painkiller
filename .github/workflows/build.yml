name: Build Windows x86 patch
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Win32 (MSVC 2022)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DBUILD_TESTING=ON
      - name: Compile DLLs and tests
        run: cmake --build build --config Release --parallel
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package ready-to-copy release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/vanilla,dist/custom-exe | Out-Null
          Copy-Item build/release/Release/dinput8.dll dist/vanilla/
          Copy-Item build/release/Release/Light.dll dist/custom-exe/
          Copy-Item config/Light.ini dist/vanilla/
          Copy-Item config/Light.ini dist/custom-exe/
          New-Item -ItemType Directory -Force -Path dist/third_party | Out-Null
          Copy-Item build/_deps/minhook-src/LICENSE.txt dist/third_party/MinHook_LICENSE.txt
          Copy-Item README.md dist/
          Copy-Item README.ru.md dist/
          Copy-Item KNOWN_LIMITATIONS.md dist/
          Copy-Item LICENSE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Light-Win32
          path: dist/
